<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
    <head>
        <title>{$title_text}</title>
        {$javascript}
        <meta name="keywords" content="{$meta_tags}">
        <meta name="description" content="c">
        <meta http-equiv="content-type" content="text/html; charset=utf-8">
        <link href="templates/theme6/style/style.css" rel="stylesheet" type="text/css">
        <link href="templates/theme6/style/menu.css" rel="stylesheet" type="text/css">



    </head>
    <body>
        <div id="dhtmltooltip"></div>
        {$tooltips}
        <!-- END TOOLTIP CODE -->
        <div id="main">
                    {foreach from=$menu item=menuitem}
                        <li>
                            <a href="{$menuitem.link}"{if $menuitem.new_window} target="_blank"{/if}>{$menuitem.text}</a>
                            {if isset($menuitem.submenu) && $menuitem.submenu|@count > 0}
                                <ul class="submenu">
                                {foreach from=$menuitem.submenu item=subitem}
                                    <li><a href="{$subitem.link}"{if $subitem.new_window} target="_blank"{/if}>{$subitem.text}</a></li>
                                {/foreach}
                                </ul>
                            {/if}
                        </li>
                    {/foreach}
            <div class="main_indent">

                <div class="width">
                    <!-- header  -->
                    <div id="header">

                    </div>
                    <div id="content">
                        <div class="login">
                            <!-- login -->
                            {$login}<br>
                                {$register}
                        </div>
