<form action="{$form_action}" method="post" >
    {if $content eq ''}
        <table>
            <tr>
                <td>{$admin_email_errors_text}</td>
                <td><input type="checkbox" name="email_mode" value="1"{if $email_mode_checked} checked{/if}></td>
            </tr>
            <tr>
                <td>{$admin_email_text}</td>
                <td><input name="admin_email" type="text" value="{$admin_email_value|escape}"></td>
            </tr>
            <tr>
                <td><hr /></td>
                <td><hr /></td>
            </tr>
            <tr>
                <td>{$email_type_text}</td>
                <td><input type="checkbox" name="email_type" value="1"{if $email_send_type_checked} checked{/if}></td>
            </tr>
            <tr>
                <td>{$email_host_text}</td>
                <td><input type="text" name="email_host" value="{$email_host_value|escape}"></td>
            </tr>
            <tr>
                <td>{$email_port_text}</td>
                <td><input type="text" name="email_port" value="{$email_port_value|escape}"></td>
            </tr>
            <tr>
                <td>{$email_user_text}</td>
                <td><input type="text" name="email_user" value="{$email_user_value|escape}"></td>
            </tr>
            <tr>
                <td>{$email_pass_text}</td>
                <td><input type="password" name="email_pass" value="{$email_pass_value|escape}"></td>
            </tr>
            <tr>
                <td>{$email_encryption_text}</td>
                <td>
                    <select name="email_encryption">
                        <option value="none"{if $current_encryption == 'none'} selected{/if}>None</option>
                        <option value="ssl"{if $current_encryption == 'ssl'} selected{/if}>SSL</option>
                        <option value="tls"{if $current_encryption == 'tls'} selected{/if}>TLS/STARTTLS</option>
                    </select>
                </td>
            </tr>
        </table>
        <br><br>

        <center><input type="submit" value="{$save_text|escape}" name="save" class="button"></center><br><br>

        {$admin_type_message_text}<br><br>
        <textarea name="message" cols="40" rows="3"></textarea><br><br>

        <a href="admin.php" class="button">{$page_back}</a>&nbsp;&nbsp;&nbsp;&nbsp;
        <input type="submit" value="{$send_text|escape}" name="submit" class="button">
    {else}
        <div style="margin:2em auto;max-width:500px;text-align:center;font-size:1.2em">{$content}<br><br><a href="admin.php?n=email" class="button">{$page_back}</a></div>
    {/if}
</form>
