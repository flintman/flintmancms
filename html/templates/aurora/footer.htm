                                <input name="username" type="text" placeholder="Username" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <input name="password" type="password" placeholder="Password" class="form-control" required>
                            </div>
                            <div class="form-group checkbox-group">
                                <label>
                                    <input type="checkbox" name="autologin" checked="checked">
                                    <span>{REMEMBER_ME_TEXT}</span>

    <script>
        // Theme toggle functionality
        (function() {
            const themeToggle = document.getElementById('themeToggle');
            const htmlElement = document.documentElement;

            // Check for saved theme preference or default to light mode
            const currentTheme = getCookie('theme') || 'light';
            htmlElement.setAttribute('data-theme', currentTheme);

            themeToggle.addEventListener('click', function() {
                const theme = htmlElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                htmlElement.setAttribute('data-theme', theme);
                setCookie('theme', theme, 365);
            });

            // Mobile menu toggle
            const mobileMenuToggle = document.getElementById('mobileMenuToggle');
            const navMenu = document.getElementById('navMenu');

            mobileMenuToggle.addEventListener('click', function() {
                navMenu.classList.toggle('active');
                mobileMenuToggle.classList.toggle('active');
            });

            // Cookie functions
            function setCookie(name, value, days) {
                const expires = new Date(Date.now() + days * 864e5).toUTCString();
                document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/';
            }

            function getCookie(name) {
                return document.cookie.split('; ').reduce((r, v) => {
                    const parts = v.split('=');
                    return parts[0] === name ? decodeURIComponent(parts[1]) : r;
                }, '');
            }
        })();
    </script>
</body>
